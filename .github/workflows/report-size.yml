name: Report size

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # paths:
    #   - 'src/**'
    #   - 'package.json'

jobs:
  treeshaking:
    name: Tree-shaking
    runs-on: ubuntu-latest
    # if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Git checkout
        uses: actions/checkout@v3
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build-module
      - name: === Test tree-shaking ===
        run: npm run test-treeshake
      - name: Read tree-shaken size
        id: read-size
        run: |
          BUNDLE_PATH="test/treeshake/index.bundle.min.js"
          FILESIZE=$(du -sh $BUNDLE_PATH | awk '{print $1}')
          echo "FILESIZE=$FILESIZE" >> $GITHUB_OUTPUT
          gzip -k $BUNDLE_PATH
          FILESIZE_GZIP=$(du -sh $BUNDLE_PATH.gz | awk '{print $1}')
          echo "FILESIZE_GZIP=$FILESIZE_GZIP" >> $GITHUB_OUTPUT
      - name: Find existing comment
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Bundle size
      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### 📦 Bundle size after tree-shaking
            | Filesize | Gzipped | Diff |
            |----------|---------|------|
            | ${{ steps.read-size.outputs.FILESIZE }} | ${{ steps.read-size.outputs.FILESIZE_GZIP }} | +0.0% |
