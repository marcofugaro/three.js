name: Read size

on:
  pull_request:
    # TEMP
    types: [opened, synchronize]
    # paths:
    #   - 'src/**'
    #   - 'package.json'

# This workflow runs in a read-only environment. We can safely checkout
# the PR code here.
# Reference:
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
permissions:
  contents: read

jobs:
  treeshaking:
    name: Tree-shaking
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Git checkout
        uses: actions/checkout@v3
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build-module
      - name: === Test tree-shaking ===
        run: npm run test-treeshake
      - name: Read tree-shaken size
        id: read-size
        run: |
          FILESIZE=$(stat --format=%s test/treeshake/index.bundle.min.js)
          gzip -k test/treeshake/index.bundle.min.js
          FILESIZE_GZIP=$(stat --format=%s test/treeshake/index.bundle.min.js.gz)
          echo "FILESIZE=$FILESIZE" >> $GITHUB_OUTPUT
          echo "FILESIZE_GZIP=$FILESIZE_GZIP" >> $GITHUB_OUTPUT
